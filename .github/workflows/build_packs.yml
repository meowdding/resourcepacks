name: Build and Upload Packs

on:
  push:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Run Script
        run: |
          chmod +x .github/scripts/buildpack.main.kts 
          kotlin .github/scripts/buildpack.main.kts

      - name: Upload Generated Packs
        uses: actions/upload-artifact@v4
        with:
          name: all-packs
          path: dest/*.zip
